name: Deploy to Vercel

on:
  push:
    branches:
      - claude/quantix-os-deployment-YXhhF

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover Vercel project metadata
        id: meta
        run: |
          JSON=$(curl -sf -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/quantix-os-new")
          PROJECT_ID=$(echo $JSON | jq -r '.id')
          ORG_ID=$(echo $JSON | jq -r '.accountId')
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "org_id=$ORG_ID" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOY_URL=$(npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "https://" | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ steps.meta.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.meta.outputs.project_id }}

      - name: Assign production alias
        run: |
          npx vercel alias set ${{ steps.deploy.outputs.deploy_url }} quantix-os-new.vercel.app \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ steps.meta.outputs.org_id }} || true
        env:
          VERCEL_ORG_ID: ${{ steps.meta.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.meta.outputs.project_id }}
