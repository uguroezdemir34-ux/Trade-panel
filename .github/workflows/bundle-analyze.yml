name: Bundle Analyze

# Elle tetiklenir (workflow_dispatch) — /sign-in LCP araştırması kapsamında
# client bundle'ının gerçek paket kompozisyonunu görmek için. next.config.ts
# içindeki withBundleAnalyzer zaten kurulu (ANALYZE=true next build), bu
# workflow onu CI'da çalıştırıp HTML raporlarını artifact olarak yükler.
# Yerel makineye bağımlı kalmamak için: bu adım kalıcı, ihtiyaç oldukça
# tekrar tekrar workflow_dispatch ile tetiklenebilir (generate-lockfile.yml /
# install-sentry-sdk.yml'deki aynı desen).

on: workflow_dispatch

jobs:
  bundle-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # typecheck.yml ile aynı desen — package-lock.json repoda,
      # --legacy-peer-deps .npmrc ile tutarlılık için.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # READ-ONLY teşhis — @sentry/replay'in /sign-in'in paylaşılan
      # chunk'ından hâlâ çıkmamasının nedenini araştırıyoruz: barrel
      # re-export mi, sideEffects eksikliği mi, yoksa Next.js'e özgü bir
      # chunk-gruplama davranışı mı. Hiçbir dosyayı değiştirmez.
      - name: Diagnose @sentry/nextjs package exports (read-only)
        continue-on-error: true
        run: node scripts/diagnose-sentry-nextjs-package.cjs

      # openAnalyzer:true (next.config.ts) CI'da headless ortamda no-op
      # kalır (tarayıcı açacak bir şey yok) — sadece HTML dosyaları üretir,
      # build'i bloklamaz.
      - name: Build with bundle analyzer
        run: ANALYZE=true npm run build

      - name: Upload analyzer reports
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyze-reports
          path: .next/analyze/*.html
          retention-days: 14

      # Artifact zip'i (blob storage indirme linki) bazı ortamlardan
      # erişilemiyor — bu adım aynı veriyi (client.html içine gömülü
      # webpack-bundle-analyzer chartData ağacı) npm paketi başına
      # toplam boyut olarak düz metne çevirip doğrudan job log'una
      # yazar, log her zaman GitHub API üzerinden okunabiliyor.
      # continue-on-error: rapor formatı beklenmedik şekilde değişirse
      # bu adım kırmızı görünür ama job'ı (ve artifact upload'ı) düşürmez.
      - name: Print bundle package sizes (client.html)
        continue-on-error: true
        run: node scripts/print-bundle-package-sizes.mjs .next/analyze/client.html
