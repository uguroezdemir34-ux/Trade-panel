<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="QUANTIX Logo">
  <defs>
    <!-- Ana turuncu gradient -->
    <linearGradient id="qx-grad-main" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#FFB347"/>
      <stop offset="55%"  stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#CC4400"/>
    </linearGradient>
    <!-- İç parlama -->
    <radialGradient id="qx-glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%"   stop-color="#FFD580" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <!-- Metalik çerçeve -->
    <linearGradient id="qx-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#888"/>
      <stop offset="40%"  stop-color="#FFF"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <filter id="qx-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B1A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dış halka (metalik) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#qx-ring)" stroke-width="2.5" opacity="0.5"/>

  <!-- Ana Q harfi — bold, merkez, gradient -->
  <text
    x="100" y="125"
    font-family="'SF Pro Display','Helvetica Neue','Arial Black',sans-serif"
    font-size="110"
    font-weight="900"
    text-anchor="middle"
    fill="url(#qx-grad-main)"
    filter="url(#qx-shadow)"
    letter-spacing="-4"
  >Q</text>

  <!-- İç parlama overlay -->
  <circle cx="100" cy="85" r="55" fill="url(#qx-glow)" opacity="0.35"/>

  <!-- Alt aksan çizgisi -->
  <rect x="55" y="155" width="90" height="2.5" rx="1.25" fill="#FF6B1A" opacity="0.7"/>
  <rect x="75" y="161" width="50" height="1.5" rx="0.75" fill="#FF6B1A" opacity="0.3"/>
</svg>
